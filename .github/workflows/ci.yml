name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  lint-shell:
    name: Lint shell scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Run shell lint (bash -n + shellcheck, semua file)
        run: bash tools/lint-shell.sh

  lint-js:
    name: Lint JS (biome)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install biome
        run: bun install
      - name: Biome check (*.mjs + hooks)
        run: bun run check
      - name: Biome check bin/tor-dashboard (advisory, TS via stdin)
        continue-on-error: true
        run: bunx biome check --stdin-file-path=bin/tor-dashboard.ts < bin/tor-dashboard > /dev/null

  test-health:
    name: Test health checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Smoke test health lib (no network)
        run: |
          bash -c '. ./lib/health.sh; type check_tor && type check_api && type check_ip'
          bash -c '. ./lib/fallback.sh; type fetch_with_fallback'
          ROOT="$PWD" bash -c '. ./lib/events.sh; type emit && type emit_kv'
          python3 -m py_compile lib/torctl.py
          # torctl CLI parse check (tanpa koneksi)
          python3 lib/torctl.py newnym --help >/dev/null
          python3 lib/torctl.py listen --help >/dev/null
          # render template check: no leftover placeholder in example, real conf ignored
          grep -q '{{ROOT}}' conf/torrc.example
          grep -q '{{ROOT}}' conf/privoxy.conf.example
          ! grep -q '/data/data/com.termux' conf/torrc.example
          ! grep -q '/data/data/com.termux' conf/privoxy.conf.example
          echo OK

  build-artifact:
    name: Build release tarball
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4
      - name: Create tarball (dari git index — selalu sinkron)
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          git archive --format=tar.gz --prefix="tor-${VERSION}/" \
            -o "tor-${VERSION}.tar.gz" HEAD
          tar -tzf "tor-${VERSION}.tar.gz" | head -30
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: tor-release
          path: tor-*.tar.gz

  release:
    name: Create GitHub Release
    needs: build-artifact
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: tor-release
          path: .
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: tor-*.tar.gz
          generate_release_notes: true